<form id="lead-form" class="lead-form">
  <div class="form-intro full"><span>START HERE</span><strong>Tell us what you want AI to handle.</strong><small>We’ll map what the AI should understand, what actions it can take, and where a person should stay in control.</small></div>
  <label>Name<input name="name" autocomplete="name" required></label>
  <label>Company<input name="company" autocomplete="organization" required></label>
  <label>Email<input name="email" type="email" autocomplete="email" required></label>
  <label>Phone <small>optional</small><input name="phone" type="tel" autocomplete="tel"></label>
  <label class="full">What should AI take off your plate?<textarea name="workflow" rows="3" placeholder="Missed calls, lead follow-up, scheduling, document entry, customer questions, internal knowledge…" required></textarea></label>
  <button class="button full" type="submit">Show me what AI can automate <span>→</span></button>
  <div class="form-reassurance full"><span>Clear AI scope before build</span><span>Human handoff where needed</span><span>Connects to your existing tools</span></div>
  <p class="contact-email full">Prefer email? <a href="mailto:hello@dreamprotocol.ai">hello@dreamprotocol.ai ↗</a></p>
  <p class="form-status full" id="form-status" role="status"></p>
</form>
