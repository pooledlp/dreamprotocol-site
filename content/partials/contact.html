<form id="lead-form" class="lead-form">
  <div class="form-intro full"><span>START HERE</span><strong>Tell us where the work gets stuck.</strong><small>We’ll map the workflow, the systems involved, and what should stay human.</small></div>
  <label>Name<input name="name" autocomplete="name" required></label>
  <label>Company<input name="company" autocomplete="organization" required></label>
  <label>Email<input name="email" type="email" autocomplete="email" required></label>
  <label>Phone <small>optional</small><input name="phone" type="tel" autocomplete="tel"></label>
  <label class="full">What’s wasting your team’s time?<textarea name="workflow" rows="3" placeholder="Missed calls, slow follow-up, scheduling, copy/paste, disconnected systems…" required></textarea></label>
  <button class="button full" type="submit">Show me what AI can automate <span>→</span></button>
  <div class="form-reassurance full"><span>Clear scope before build</span><span>Human handoff where needed</span><span>Works with your existing stack</span></div>
  <p class="contact-email full">Prefer email? <a href="mailto:hello@dreamprotocol.ai">hello@dreamprotocol.ai ↗</a></p>
  <p class="form-status full" id="form-status" role="status"></p>
</form>
