name: Dream Commerce research drafts
on:
  schedule:
    - cron: '20 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node commerce/engine.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dream-commerce-drafts
          path: commerce/generated
          retention-days: 14
