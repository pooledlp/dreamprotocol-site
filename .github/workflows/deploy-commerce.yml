name: Build and stage independent Dream Commerce storefront

on:
  pull_request:
    paths:
      - 'commerce/**'
      - 'shop-worker/**'
      - 'scripts/build-commerce-worker.mjs'
      - '.github/workflows/deploy-commerce.yml'
  push:
    branches: [main]
    paths:
      - 'commerce/**'
      - 'shop-worker/**'
      - 'scripts/build-commerce-worker.mjs'
      - '.github/workflows/deploy-commerce.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate standalone assets
        run: node scripts/build-commerce-worker.mjs
      - name: Test Worker and payment safeguards
        run: |
          node --check shop-worker/src/index.mjs
          node --check shop-worker/public/shop.js
          node --test shop-worker/shop.test.mjs
      - name: Retain staged shop preview
        uses: actions/upload-artifact@v4
        with:
          name: standalone-commerce-preview
          path: shop-worker/public
          retention-days: 7

  deploy-preview:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover Cloudflare account from verified domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing Cloudflare API token."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const response=await fetch('https://api.cloudflare.com/client/v4/zones?name=dreamprotocol.ai&per_page=10',{
            headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},
            signal:AbortSignal.timeout(20000)
          });
          const payload=await response.json();
          if(!response.ok||payload.success!==true||!Array.isArray(payload.result)||payload.result.length!==1)throw Error('Cannot resolve the dedicated dreamprotocol.ai Cloudflare zone');
          const zone=payload.result[0];
          if(zone.name!=='dreamprotocol.ai'||zone.status!=='active'||!zone.account?.id)throw Error('Cloudflare domain missing active zone or account');
          fs.appendFileSync(process.env.GITHUB_ENV,'CLOUDFLARE_ACCOUNT_ID='+zone.account.id+'\\n');
          console.log('Cloudflare account verified using the existing dreamprotocol.ai zone.');
          NODE
      - name: Generate standalone assets
        run: node scripts/build-commerce-worker.mjs
      - name: Deploy Worker staging without touching DNS
        working-directory: shop-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.102.0 deploy --config wrangler.toml
