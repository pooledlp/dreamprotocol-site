name: One-time Dream Protocol Cloudflare resource inventory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/domain-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List sanitized DNS and Worker resources without modifying Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token)throw Error('Cloudflare token not configured');
          const cf=async path=>{
            try{
              const response=await fetch('https://api.cloudflare.com/client/v4'+path,{
                headers:{Authorization:'Bearer '+token},
                signal:AbortSignal.timeout(15000)
              });
              const data=await response.json();
              return {ok:response.ok&&data.success===true,status:response.status,data:data.result,info:data.result_info||{}};
            }catch(e){return {ok:false,status:'network-error',data:null}}
          };
          const z=await cf('/zones?name=dreamprotocol.ai&per_page=10');
          if(!z.ok||!Array.isArray(z.data)||z.data.length!==1||z.data[0].name!=='dreamprotocol.ai')throw Error('Cannot identify one authorized zone');
          const zone=z.data[0], zid=zone.id;
          console.log('ZONE',JSON.stringify({name:zone.name,status:zone.status,plan:zone.plan?.name||null}));
          let records=[];
          for(let page=1;page<=8;page++){
            const r=await cf('/zones/'+zid+'/dns_records?per_page=100&page='+page);
            if(!r.ok){console.log('DNS_STATUS',r.status);break}
            if(!Array.isArray(r.data))break;
            records.push(...r.data);
            if(r.data.length<100)break;
          }
          const allowContent=new Set(['A','AAAA','CNAME','MX','NS','SRV']);
          console.log('DNS_COUNTS',JSON.stringify(records.reduce((a,r)=>(a[r.type]=(a[r.type]||0)+1,a),{})));
          for(const r of records.sort((a,b)=>String(a.name).localeCompare(String(b.name)))){
            if(r.type==='TXT'||r.type==='CAA'){console.log('DNS',JSON.stringify({name:r.name,type:r.type,content:'[redacted]'}));continue}
            console.log('DNS',JSON.stringify({name:r.name,type:r.type,content:allowContent.has(r.type)?r.content:'[redacted]',proxied:r.proxied}));
          }
          const requests=[
            ['WORKER_ROUTES','/zones/'+zid+'/workers/routes'],
            ['WORKERS','/accounts/'+zone.account.id+'/workers/scripts'],
            ['WORKER_CUSTOM_DOMAINS','/accounts/'+zone.account.id+'/workers/domains'],
            ['CLOUDFLARE_PAGES','/accounts/'+zone.account.id+'/pages/projects'],
            ['ZONE_RULESETS','/zones/'+zid+'/rulesets']
          ];
          for(const [label,path] of requests){
            const r=await cf(path);
            if(!r.ok){console.log(label+'_STATUS',r.status);continue}
            const items=Array.isArray(r.data)?r.data:r.data?.result||r.data?.items||[];
            if(!Array.isArray(items)){console.log(label+'_STATUS','unexpected response');continue}
            console.log(label+'_COUNT',items.length);
            for(const item of items){
              const obj= label==='WORKER_ROUTES'?{pattern:item.pattern,script:item.script}
              :label==='WORKERS'?{id:item.id,modified_on:item.modified_on,created_on:item.created_on}
              :label==='WORKER_CUSTOM_DOMAINS'?{hostname:item.hostname,service:item.service,zone_name:item.zone_name}
              :label==='CLOUDFLARE_PAGES'?{name:item.name,subdomain:item.subdomain,production_branch:item.production_branch}
              :{id:item.id,kind:item.kind,name:item.name,phase:item.phase};
              console.log(label,JSON.stringify(obj));
            }
          }
          console.log('READ_ONLY_COMPLETE');
          NODE
      - name: Check public endpoint reachability without reading private content
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const urls=[
            'https://dreamprotocol.ai/',
            'https://dreamprotocol.ai/commerce/',
            'https://dreamprotocol.ai/kalshi/',
            'https://dreamprotocol.ai/btc/',
            'https://dreamprotocol.ai/try/',
            'https://dreamprotocol.ai/live/',
            'https://shop.dreamprotocol.ai/',
            'https://perio.dreamprotocol.ai/',
            'https://api.dreamprotocol.ai/',
            'https://api.dreamprotocol.ai/health',
            'https://calls.dreamprotocol.ai/health',
            'https://command.dreamprotocol.ai/',
            'https://metrics.dreamprotocol.ai/collect'
          ];
          const results=await Promise.all(urls.map(async u=>{
            try{
              const r=await fetch(u,{signal:AbortSignal.timeout(12000),redirect:'follow'});
              const final=new URL(r.url);
              await r.body?.cancel();
              return {url:u,status:r.status,final:final.hostname+final.pathname};
            }catch(e){return {url:u,error:e.name||'unavailable'}}
          }));
          for(const r of results)console.log('HTTP_PROBE',JSON.stringify(r));
          NODE

      - name: Inspect non-sensitive health flags and last scan timestamps
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoints=[
            ['business-analyzer','https://api.dreamprotocol.ai/health'],
            ['dreamboard','https://api.dreamprotocol.ai/dreamboard/status'],
            ['dreampredict','https://api.dreamprotocol.ai/dream-predict/status'],
            ['call-alerts','https://calls.dreamprotocol.ai/health']
          ];
          for(const [name,url] of endpoints){
            try{
              const r=await fetch(url,{signal:AbortSignal.timeout(12000)});
              if(!r.ok){console.log('SERVICE_HEALTH',JSON.stringify({name,status:r.status}));continue}
              const d=await r.json();
              const limited=name==='dreampredict'?{
                mode:d.mode,realMoney:d.realMoney,lastScanAt:d.lastScanAt,
                scanner:{scansToday:d.scanner?.scansToday,totalScans:d.scanner?.totalScans,
                  lastDurationMs:d.scanner?.lastDurationMs},
                forecastLab:{enabled:d.forecastLab?.enabled,lastModelAt:d.forecastLab?.lastModelAt},
                execution:{live:d.execution?.live,orderSubmission:d.execution?.orderSubmission},
                lastError:typeof d.lastError==='string'?d.lastError.slice(0,180):null
              }:name==='call-alerts'?{up:d.up,email:d.email,sms:d.sms}
              :name==='dreamboard'?{enabled:d.enabled,configured:d.configured,status:d.status}
              :{status:d.status};
              console.log('SERVICE_HEALTH',JSON.stringify({name,http:r.status,...limited}));
            }catch(e){console.log('SERVICE_HEALTH',JSON.stringify({name,error:e.name||'unavailable'}))}
          }
          NODE
