name: Call alerts API preflight
on:
  push:
    branches: [codex/call-alerts-api-preflight]
    paths: [.github/workflows/call-alerts-api-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check existing Cloudflare connection without exposing credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DP_D1_DATABASE_ID: ${{ vars.DP_D1_DATABASE_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          names = ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'DP_D1_DATABASE_ID']
          for name in names:
              print(name + ': ' + ('configured' if os.environ.get(name) else 'missing'))
          token = os.environ.get('CLOUDFLARE_API_TOKEN')
          if not token:
              raise SystemExit(1)
          request = urllib.request.Request('https://api.cloudflare.com/client/v4/user/tokens/verify',
              headers={'Authorization': 'Bearer ' + token})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.load(response)
              print('Token verification: ' + ('active' if data.get('success') and data.get('result', {}).get('status') == 'active' else 'not verified'))
          except urllib.error.HTTPError as error:
              print('Token verification HTTP status:', error.code)
              raise SystemExit(1)
          PY
