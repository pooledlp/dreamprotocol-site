name: Configure Dream Commerce shop redirect without Workers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/shop-redirect-once.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create scoped shop redirect rule without changing DNS yet
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token)throw Error('Missing Cloudflare token');
          const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
          const base='https://api.cloudflare.com/client/v4';
          async function api(path,method='GET',body){
            const r=await fetch(base+path,{method,headers,body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(15000)});
            const x=await r.json().catch(()=>({}));
            return {ok:r.ok&&x.success===true,status:r.status,result:x.result,errors:(x.errors||[]).map(e=>e.code)};
          }
          const lookup=await api('/zones?name=dreamprotocol.ai&per_page=10');
          if(!lookup.ok||lookup.result?.length!==1||lookup.result[0].name!=='dreamprotocol.ai'||lookup.result[0].status!=='active')throw Error('Zone mismatch');
          const zone=lookup.result[0];
          const existing=await api('/zones/'+zone.id+'/pagerules');
          if(!existing.ok||!Array.isArray(existing.result))throw Error('Cannot inspect Page Rules');
          const target='shop.dreamprotocol.ai/*',destination='https://dreamprotocol.ai/commerce/';
          if(existing.result.some(x=>x.targets?.some(t=>t.constraint?.value===target))){
            const rule=existing.result.find(x=>x.targets?.some(t=>t.constraint?.value===target));
            const matched=rule.actions?.some(a=>a.id==='forwarding_url'&&a.value?.url===destination&&a.value?.status_code===302);
            if(!matched||rule.status!=='active')throw Error('Conflicting shop rule detected; no changes made');
            console.log('REDIRECT_ALREADY_EXISTS');process.exit(0);
          }
          const created=await api('/zones/'+zone.id+'/pagerules','POST',{
            targets:[{target:'url',constraint:{operator:'matches',value:target}}],
            actions:[{id:'forwarding_url',value:{url:destination,status_code:302}}],
            priority:1,status:'active'
          });
          if(!created.ok)throw Error('REDIRECT_CREATE_FAILED: HTTP '+created.status+' Cloudflare codes '+JSON.stringify(created.errors));
          console.log('REDIRECT_READY: shop.dreamprotocol.ai/* => https://dreamprotocol.ai/commerce/ (302)');
          console.log('NOTE: DNS is still unproxied and unchanged. Proxied DNS is required before redirect takes effect.');
          NODE
