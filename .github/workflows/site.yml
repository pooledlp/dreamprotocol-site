name: Build, check, and publish website
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays at 16:17 UTC. GitHub schedules may be delayed.
    - cron: '17 16 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamprotocol-site-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  editorial:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reserve one researched article attempt this week
        id: reserve
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/editorial.mjs reserve
      - name: Persist reservation before using the paid AI service
        if: steps.reserve.outputs.reserved == 'true'
        run: |
          git config user.name 'dreamprotocol-editorial[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/runs
          git commit -m 'Reserve weekly researched article'
          git push origin HEAD:main
      - name: Research, write, and independently review
        if: steps.reserve.outputs.reserved == 'true'
        id: generate
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/editorial.mjs generate
      - name: Validate the proposed article in the complete website
        if: steps.generate.outcome == 'success'
        id: validate
        continue-on-error: true
        run: |
          npm run build
          npm run check
          npm test
      - name: Retain editorial diagnostics outside the published site
        if: always() && steps.reserve.outputs.reserved == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: editorial-diagnostics
          path: _editorial
          if-no-files-found: ignore
          retention-days: 7
      - name: Save the outcome and only commit validated articles
        if: always() && steps.reserve.outputs.reserved == 'true'
        run: |
          node scripts/editorial.mjs finalize '${{ steps.validate.outcome }}'
          git add content/runs
          if [ '${{ steps.validate.outcome }}' = 'success' ]; then
            git add content/generated
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record weekly editorial outcome'
            git push origin HEAD:main
          fi
      - name: Report an article held for attention
        if: steps.reserve.outputs.reserved == 'true' && steps.validate.outcome != 'success'
        run: |
          echo '::error::New article held. Inspect the editorial run. Existing approved content can still publish.'
          exit 1

  build:
    needs: editorial
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build published pages for today
        run: npm run build
      - name: Check links, SEO metadata, and JavaScript
        run: npm run check
      - name: Test publishing dates and repeatability
        run: npm test
      - name: Package only public website files
        run: node scripts/package-site.mjs
      - name: Report the editorial queue
        run: node scripts/queue-status.mjs
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: always() && !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested website
        id: deployment
        uses: actions/deploy-pages@v4
