name: Verify Dream Commerce domain
on:
  push:
    branches: [main]
    paths: ['.github/workflows/activate-commerce-route-once.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public shop and API
        run: |
          node --input-type=module <<'NODE'
          for(let attempt=0;attempt<12;attempt++){
            try{
              const health=await fetch('https://shop.dreamprotocol.ai/health',{signal:AbortSignal.timeout(10000)});
              const data=await health.json();
              if(data.service!=='dream-commerce')throw Error('DNS still resolving old store');
              const page=await fetch('https://shop.dreamprotocol.ai/',{signal:AbortSignal.timeout(10000)});
              const html=await page.text();
              if(page.status!==200||!html.includes('Dream Commerce')||html.includes('shopify.exit_interstitial'))throw Error('Unexpected storefront');
              for(const path of ['/commerce/shop.css','/commerce/shop.js','/commerce/catalog.json']){
                const r=await fetch('https://shop.dreamprotocol.ai'+path,{signal:AbortSignal.timeout(10000)});
                if(!r.ok)throw Error('Asset failed: '+path);
              }
              const api=await fetch('https://api.dreamprotocol.ai/health');
              if((await api.json()).status!=='ok')throw Error('Shared API health failed');
              console.log('VERIFIED: Shop HTML and all assets return 200; Shopify removed; existing API healthy.');
              console.log('COMMERCE STATUS: '+JSON.stringify(data));process.exit(0);
            }catch(e){console.log('Attempt '+(attempt+1)+': '+e.message);await new Promise(r=>setTimeout(r,10000));}
          }
          throw Error('Public shop verification failed');
          NODE
