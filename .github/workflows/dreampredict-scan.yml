name: DreamPredict scanner heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreampredict-scanner-heartbeat
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger DreamPredict scan
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 45 --retry 2 --retry-delay 5             "https://api.dreamprotocol.ai/dream-predict/scan"             -o /tmp/dreampredict-scan.json

          jq -e 'if .ok == false then error(.error // "DreamPredict scan returned ok=false") else . end'             /tmp/dreampredict-scan.json >/dev/null

          jq '{
            ok,
            version,
            lastScanAt,
            scannedEvents: (.scan.scannedEvents // 0),
            scannedMarkets: (.scan.scannedMarkets // 0),
            structuralCandidates: ((.scan.arbOpportunities // []) | length),
            structuralQualified: ([.scan.arbOpportunities[]? | select(.qualified == true)] | length),
            polymarketMarkets: (.scan.crossVenue.scannedPolymarketMarkets // 0),
            strictCrossMatches: (.scan.crossVenue.strictMatches // 0),
            crossVenueQualified: (.scan.crossVenue.qualifiedArbs // 0)
          }' /tmp/dreampredict-scan.json
