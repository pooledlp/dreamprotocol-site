name: One-time stop DreamPredict Cloudflare cron
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stop-dreampredict-once.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove DreamPredict scheduled trigger from existing Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token)throw Error('Cloudflare API token missing');
          const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
          const base='https://api.cloudflare.com/client/v4';
          const lookup=await fetch(base+'/zones?name=dreamprotocol.ai&per_page=10',{headers,signal:AbortSignal.timeout(15000)});
          const zoneResult=await lookup.json();
          if(!lookup.ok||!zoneResult.success||zoneResult.result?.length!==1)throw Error('Could not identify the owned dreamprotocol.ai zone');
          const zone=zoneResult.result[0];
          if(zone.name!=='dreamprotocol.ai'||zone.status!=='active'||!zone.account?.id)throw Error('Zone mismatch; aborting');
          const target='/accounts/'+zone.account.id+'/workers/scripts/dreamprotocol-business-analyzer/schedules';
          const response=await fetch(base+target,{method:'PUT',headers,body:'[]',signal:AbortSignal.timeout(15000)});
          const result=await response.json().catch(()=>({}));
          if(!response.ok||result.success!==true){
            const codes=(result.errors||[]).map(e=>e.code).filter(Boolean);
            throw Error('STOP_FAILED: HTTP '+response.status+' Cloudflare codes '+JSON.stringify(codes)+'. Existing token cannot modify this Worker. No other services changed.');
          }
          console.log('STOP_SUCCESS: DreamPredict five-minute Cloudflare cron removed from existing dreamprotocol-business-analyzer Worker.');
          console.log('Resulting scheduled triggers: '+JSON.stringify((result.result||[]).map(x=>x.cron)));
          NODE
